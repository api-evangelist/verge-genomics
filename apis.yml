name: Verge Genomics
description: >-
  Verge Genomics (now operating as Verge Labs) is an AI-driven drug discovery
  biotechnology company using human genomics data and machine learning to
  discover and develop treatments for neurodegenerative and neuromuscular
  diseases such as ALS and Parkinson's. Its proprietary all-in-human CONVERGE
  platform integrates large-scale multi-omic patient datasets derived from human
  tissue with machine learning to identify novel therapeutic targets, and has
  been applied in pharmaceutical collaborations with Eli Lilly, AstraZeneca and
  Alexion. As of enrichment, the company exposes no public developer API,
  developer portal, SDK, or machine-readable API specification; CONVERGE is an
  internal research platform, not a consumer-facing API.
